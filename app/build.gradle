plugins {
    id 'com.android.application'
}

android {
    namespace 'org.communitypoke.settingsbrowser'
    compileSdk 34

    defaultConfig {
        applicationId 'org.communitypoke.settingsbrowser'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// kotlin-stdlib 1.8+ already ships the classes that used to live in the
// jdk7/jdk8 artifacts; some androidx transitives still request the old
// modules and produce duplicate-class errors, so drop them.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
}

dependencies {
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.annotation:annotation:1.7.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
